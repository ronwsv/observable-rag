name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Hermetic, no downloads / network: lexical embeddings + offline mock LLM.
      GAPRAG_EMBEDDING_PROVIDER: hash
      GAPRAG_LLM_PROVIDER: mock
      GAPRAG_JSON_LOGS: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests evals

      - name: Test
        run: pytest

      - name: Retrieval eval (smoke)
        run: python evals/run_eval.py
